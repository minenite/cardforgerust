[package]
name = "mod-cardforge"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "CardForge Horizon trait mod — wires native hooks into cardforge-core."

# Excluded from the cardforgerust workspace (see root Cargo.toml). Do not add
# an empty [workspace] here: native-build stages this package into Horizon's
# workspace and a nested [workspace] table fails the resolve.

[dependencies]
# The launcher rewrites this to the staged Horizon source.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "66f3981f522b24c250b21523a70080965b940424" }
# Nested under api/ so native-build stages them with this package.
cardforge-api = { path = "cardforge-api" }
cardforge-core = { path = "cardforge-core" }
hello-plugin = { path = "hello-plugin" }
cf-friends = { path = "cf-friends" }
cf-ranks = { path = "cf-ranks" }
cf-travel = { path = "cf-travel" }
log = "0.4"
parking_lot = "0.12"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[package]
name = "cardforge-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["icedmoca <blazehavenservers@gmail.com>"]
repository = "https://github.com/minenite/cardforgerust"
description = "Rust plugin API for CardForge on Horizon 26.3 (Bukkit-inspired, not Java-compatible)."
publish = false

[dependencies]
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

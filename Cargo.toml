[workspace]
resolver = "2"
members = [
    "crates/cardforge-api",
    "crates/cardforge-core",
    "examples/hello-plugin",
]
default-members = [
    "crates/cardforge-api",
    "crates/cardforge-core",
    "examples/hello-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["icedmoca <blazehavenservers@gmail.com>"]
repository = "https://github.com/minenite/cardforgerust"

[workspace.dependencies]
cardforge-api = { path = "crates/cardforge-api", version = "0.1.0" }
cardforge-core = { path = "crates/cardforge-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["serde", "v4"] }
log = "0.4"

[workspace]
resolver = "2"
members = [
    "crates/cardforge-host/api/cardforge-api",
    "crates/cardforge-host/api/cardforge-core",
    "crates/cardforge-host/api/hello-plugin",
]
exclude = [
    # Built by horizon-launcher native-build; depends on horizon-client.
    "crates/cardforge-host/api",
]
default-members = [
    "crates/cardforge-host/api/cardforge-api",
    "crates/cardforge-host/api/cardforge-core",
    "crates/cardforge-host/api/hello-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["icedmoca <blazehavenservers@gmail.com>"]
repository = "https://github.com/minenite/cardforgerust"
